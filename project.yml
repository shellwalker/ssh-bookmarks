name: SSHBookmarksUI
options:
  bundleIdPrefix: com.shellwalker
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  CODE_SIGN_STYLE: Manual
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGNING_REQUIRED: NO
  ENABLE_HARDENED_RUNTIME: NO
targets:
  SSHBookmarks:
    type: application
    platform: macOS
    sources:
      - path: UITests/HostStub.swift
    settings:
      PRODUCT_NAME: SSH Bookmarks
      PRODUCT_BUNDLE_IDENTIFIER: com.shellwalker.SSHBookmarks
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Resources/Info.plist
      CODE_SIGN_ENTITLEMENTS: Resources/SSHBookmarks.entitlements
    postBuildScripts:
      - name: Use SwiftPM app bundle
        script: |
          set -euo pipefail
          APP="${SRCROOT}/build/SSH Bookmarks.app"
          DEST="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
          if [[ ! -d "$APP" ]]; then
            echo "missing $APP — run Scripts/build_app.sh first" >&2
            exit 1
          fi
          rm -rf "$DEST"
          cp -R "$APP" "$DEST"
          codesign --force --sign - --entitlements "${SRCROOT}/Resources/SSHBookmarks.entitlements" "$DEST"
  SSHBookmarksUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/SSHBookmarksUITests
    dependencies:
      - target: SSHBookmarks
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.shellwalker.SSHBookmarksUITests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: SSHBookmarks
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
schemes:
  SSHBookmarksUI:
    build:
      targets:
        SSHBookmarks: all
        SSHBookmarksUITests: [test]
    test:
      targets:
        - SSHBookmarksUITests
      environmentVariables:
        MENUSH_SCREENSHOT_DIR: $(SRCROOT)/build/ui-screenshots
