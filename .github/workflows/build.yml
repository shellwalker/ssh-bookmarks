name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (macOS 14, arm64)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          # macos-14 镜像默认 Xcode 15.4；有 Xcode 16 时优先使用（Swift 6 工具链，仍以 Swift 5 语言模式编译）。
          XCODE="$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' | sort -V | tail -n 1)"
          if [[ -n "$XCODE" ]]; then
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version
          swift --version
          uname -m

      - name: Lint (swift-format)
        run: |
          if xcrun --find swift-format > /dev/null 2>&1; then
            xcrun swift-format lint --recursive Sources Tests UITests Package.swift
          else
            echo "swift-format not available in this Xcode, skipping"
          fi

      - name: Test
        run: swift test

      - name: Build app
        env:
          ARCH: arm64
          BUILD_NUMBER: ${{ github.run_number }}
          SSHBOOKMARKS_CHANNEL: development
        run: Scripts/build_app.sh

      - name: Package
        env:
          ARCH: arm64
        run: Scripts/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSH-Bookmarks-${{ github.sha }}-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  ui:
    name: UI automation and screenshots
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE="$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' | sort -V | tail -n 1)"
          if [[ -n "$XCODE" ]]; then
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version
          uname -m

      - name: UI tests
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SSHBOOKMARKS_CHANNEL: development
        run: Scripts/ci_ui_tests.sh

      - name: Screenshot summary
        if: always()
        run: |
          {
            echo "## UI screenshots"
            echo
            echo "不做像素比对（菜单栏时钟和动画会导致误红）。完整图片在 artifact \`ui-screenshots\`。"
            echo "运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [[ -f build/ui-screenshots/index.md ]]; then
              cat build/ui-screenshots/index.md
            else
              echo "没有生成截图索引。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment screenshot index on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('build/ui-screenshots/index.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY_FILE="$(mktemp)"
          {
            echo "<!-- menush-ui-screenshots -->"
            echo "UI 截图索引（图片在本次运行的 artifact \`ui-screenshots\`，私有 artifact 不能直接嵌进评论）。"
            echo
            echo "运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            cat build/ui-screenshots/index.md
          } > "$BODY_FILE"
          PR="${{ github.event.pull_request.number }}"
          EXISTING="$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --jq '.[] | select(.body | startswith("<!-- menush-ui-screenshots -->")) | .id' | head -n 1)"
          if [[ -n "$EXISTING" ]]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING}" -F body=@"$BODY_FILE" >/dev/null
          else
            gh pr comment "$PR" --body-file "$BODY_FILE"
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: build/ui-screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload UI failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-xcresult
          path: |
            build/ui-results.xcresult
            build/ui-derived/Logs
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: SSH and sync end-to-end
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE="$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' | sort -V | tail -n 1)"
          if [[ -n "$XCODE" ]]; then
            sudo xcode-select -s "$XCODE"
          fi
          swift --version
          uname -m

      - name: Start temporary sshd
        run: Scripts/ci_sshd_fixture.sh start

      - name: Integration tests
        run: |
          set -a
          # shellcheck disable=SC1091
          source build/sshd-fixture.env
          set +a
          swift test --filter Integration --no-parallel

      - name: Stop temporary sshd
        if: always()
        run: Scripts/ci_sshd_fixture.sh stop

      - name: Upload sshd logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sshd-logs
          path: |
            /tmp/menush-ci-sshd/*.log
            /tmp/menush-ci-sshd/*.conf
          if-no-files-found: ignore
          retention-days: 7
